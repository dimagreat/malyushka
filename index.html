<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Малюшка">
<meta name="theme-color" content="#ffd84d">
<title>Малюшка</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --bar: #ffd84d;
    --bar-dark: #f2b705;
    --on: #6bd36b;
    --on-dark: #2e9e2e;
    --shadow: 0 3px 0 rgba(0,0,0,.18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: none; overscroll-behavior: none; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  .bar { background: var(--bar); flex: none; padding: 6px 10px; }
  .top { display: flex; align-items: center; gap: 8px; padding-top: max(6px, env(safe-area-inset-top)); border-bottom: 4px solid var(--bar-dark); }
  .bottom { display: flex; flex-direction: column; gap: 8px; padding-bottom: max(8px, env(safe-area-inset-bottom)); border-top: 4px solid var(--bar-dark); }
  .spacer { flex: 1; }

  button { font: inherit; border: none; cursor: pointer; padding: 0; color: inherit; }
  .btn { flex: none; width: 50px; height: 50px; border-radius: 15px; background: #fff; font-size: 27px; box-shadow: var(--shadow); display: grid; place-items: center; transition: transform .1s; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .btn:disabled { opacity: .35; }
  .btn.warn { animation: wiggle .4s infinite; background: #ff7a7a; }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }

  /* tools: always fit the width, never scroll */
  .tools { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 460px; width: 100%; margin: 0 auto; }
  .tools .btn { width: 100%; height: 56px; font-size: 30px; }
  .tools .btn.on { background: var(--on); box-shadow: 0 0 0 3px var(--on-dark), var(--shadow); }
  .size-dot { display: block; border-radius: 50%; background: #333; }

  /* palette: wraps into rows, never scrolls */
  .palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 8px; justify-items: center; max-width: 620px; width: 100%; margin: 0 auto; }
  .color { width: 40px; height: 40px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(0,0,0,.12), var(--shadow); }
  .color.on { box-shadow: 0 0 0 3px #fff, 0 0 0 6px #333; }
  .color.rainbow { background: conic-gradient(#e53935, #fdd835, #7cb342, #29b6f6, #7e57c2, #ec407a, #e53935); }
  .color.tex { background-size: 120px; background-position: center; }
  .ptabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 460px; width: 100%; margin: 0 auto; }
  .ptab { height: 38px; border-radius: 12px; background: rgba(255,255,255,.55); font-size: 22px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 800; font-size: 15px; color: #6b5200; }
  .ptab b { font-size: 22px; }
  .ptab.on { background: #fff; color: #333; box-shadow: var(--shadow); }
  .burst { position: absolute; pointer-events: none; font-size: 22px; animation: burst .7s ease-out forwards; }
  @keyframes burst { from { transform: translate(-50%,-50%) scale(.4); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(90deg); opacity: 0; } }
  .voice { position: absolute; left: 10px; top: 10px; width: 60px; height: 60px; border-radius: 50%; font-size: 34px; background: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.18), 0 0 0 4px var(--bar); display: grid; place-items: center; z-index: 2; }
  .voice.play { animation: wiggle .3s 3; }
  .sound-toggle { margin-left: auto; }
  .sticker { width: 44px; height: 44px; border-radius: 12px; background: #fff; font-size: 28px; box-shadow: var(--shadow); display: grid; place-items: center; }
  .sticker.on { background: var(--on); box-shadow: 0 0 0 3px var(--on-dark); }
  .hidden { display: none !important; }

  #wrap { position: relative; flex: 1; min-height: 0; background: #fff; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #lines { pointer-events: none; }
  #ghost { position: absolute; left: 0; top: 0; pointer-events: none; line-height: 1; transform: translate(-50%, -50%) scale(1.15); opacity: .85; filter: drop-shadow(0 6px 6px rgba(0,0,0,.25)); font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }

  /* coloring pages picker */
  #pages { position: fixed; inset: 0; z-index: 10; background: #fff7d6; display: flex; flex-direction: column; }
  #pages header { display: flex; align-items: center; gap: 10px; padding: max(10px, env(safe-area-inset-top)) 12px 10px; background: var(--bar); border-bottom: 4px solid var(--bar-dark); }
  #pages h1 { margin: 0; font-size: 24px; }
  .cats { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; flex: none; }
  .cat { flex: none; display: flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 999px; background: #fff; font-size: 18px; font-weight: 800; box-shadow: var(--shadow); white-space: nowrap; }
  .cat b { font-size: 26px; }
  .cat.on { background: var(--on); box-shadow: 0 0 0 3px var(--on-dark); }
  .grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; padding: 4px 12px max(16px, env(safe-area-inset-bottom)); align-content: start; touch-action: pan-y; }
  .card { position: relative; background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 0 rgba(0,0,0,.15); aspect-ratio: 1; cursor: pointer; }
  .card img { width: 100%; height: 100%; object-fit: contain; display: block; padding: 8px 8px 34px; }
  .card span { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-weight: 800; font-size: 19px; color: #333; }
  .card.blank { display: grid; place-items: center; font-size: 70px; padding-bottom: 24px; }

  #toast { position: fixed; left: 50%; top: 40%; transform: translate(-50%,-50%) scale(.5); font-size: 90px; opacity: 0; pointer-events: none; transition: all .35s cubic-bezier(.3,1.6,.5,1); z-index: 20; }
  #toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
</style>
</head>
<body>
<div id="app">
  <div class="bar top">
    <button class="btn" id="undo" title="Назад">↩️</button>
    <button class="btn" id="redo" title="Вперед">↪️</button>
    <div class="spacer"></div>
    <button class="btn" id="openPages" title="Розмальовки">🐿️</button>
    <button class="btn" id="share" title="Зберегти на телефон">📤</button>
    <button class="btn" id="clear" title="Очистити">🗑️</button>
  </div>

  <div id="wrap">
    <canvas id="c"></canvas>
    <canvas id="lines"></canvas>
    <div id="ghost" class="hidden"></div>
    <button class="voice hidden" id="voice" title="Голос тваринки"></button>
  </div>

  <div class="bar bottom">
    <div class="tools" id="tools"></div>
    <div class="ptabs" id="ptabs"></div>
    <div class="palette" id="colors"></div>
    <div class="palette hidden" id="stickers"></div>
  </div>
</div>

<div id="pages" class="hidden">
  <header><button class="btn" id="closePages">✖️</button><h1>Розмальовки</h1><button class="btn sound-toggle" id="soundToggle" title="Звук">🔊</button></header>
  <div class="cats" id="cats"></div>
  <div class="grid" id="pagesGrid"></div>
</div>

<div id="toast"></div>

<script src="paints.js"></script>
<script src="sounds/animals.js"></script>
<script src="sounds.js"></script>
<script src="pages/core.js"></script>
<script src="pages/home.js"></script>
<script src="pages/farm.js"></script>
<script src="pages/sea.js"></script>
<script src="pages/savanna.js"></script>
<script src="pages/forest.js"></script>
<script>
(() => {
  const COLORS = ['#000000','#ffffff','#e53935','#ff7043','#ffb300','#fdd835','#7cb342','#2e7d32','#29b6f6','#1e63d6','#7e57c2','#ec407a','#8d6e63'];
  const RAINBOW = 'rainbow';
  const SIZES = [6, 14, 28];              // brush width in CSS px
  const STICKER_SIZES = [56, 90, 130];    // sticker size in CSS px for the same 3 steps
  const STICKERS = ['⭐','❤️','🌸','🐱','🐶','🦄','🌈','☀️','🚗','🦋','🍎','🎈','🐟','🌳','👑','🍦'];
  const TOOLS = [
    { id: 'brush',   icon: '🖌️' },
    { id: 'fill',    icon: '🪣' },
    { id: 'sticker', icon: '⭐' },
    { id: 'eraser',  icon: '🧽' },
  ];
  const BG = '#ffffff';
  const MAX_UNDO = 30;
  const DRAFT_KEY = 'malyushka-draft';
  const PAGE_KEY = 'malyushka-page';
  const CAT_KEY = 'malyushka-cat';
  const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

  const { CATEGORIES, PAGES } = window.COLORING;
  const PAINTS = window.PAINTS;
  const SFX = window.SFX;
  const PALETTE_TABS = [
    { id: 'plain',   icon: '🎨', name: 'Фарби' },
    { id: 'glitter', icon: '✨', name: 'Блискітки' },
    { id: 'pearl',   icon: '🫧', name: 'Перламутр' },
  ];
  const ANIMAL_EMOJI = {
    cat: '🐱', bunny: '🐰', puppy: '🐶', hamster: '🐹', parrot: '🦜',
    cow: '🐮', pig: '🐷', chicken: '🐔', sheep: '🐑',
    fish: '🐟', octopus: '🐙', whale: '🐳', turtle: '🐢', crab: '🦀',
    lion: '🦁', elephant: '🐘', giraffe: '🦒', zebra: '🦓',
    squirrel: '🐿️', bear: '🐻', owl: '🦉', hedgehog: '🦔', butterfly: '🦋',
  };

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  // Coloring-page outlines live on their own layer above the paint, so brushes never cover the lines.
  const lines = document.getElementById('lines');
  const lctx = lines.getContext('2d', { willReadFrequently: true });
  const wrap = document.getElementById('wrap');
  const ghost = document.getElementById('ghost');

  const state = { tool: 'brush', color: COLORS[2], sizeIdx: 1, sticker: STICKERS[0], hue: 0, page: null, tab: 'plain' };
  let undoStack = [], redoStack = [];
  let dpr = 1;

  const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };

  // ---------- canvas setup ----------
  function resize() {
    const rect = wrap.getBoundingClientRect();
    const newDpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.round(rect.width * newDpr), h = Math.round(rect.height * newDpr);
    if (!w || !h || (w === canvas.width && h === canvas.height)) return;
    let old = null;
    if (canvas.width && canvas.height) {
      old = document.createElement('canvas');
      old.width = canvas.width; old.height = canvas.height;
      old.getContext('2d').drawImage(canvas, 0, 0);
    }
    dpr = newDpr;
    canvas.width = w; canvas.height = h;
    ctx.fillStyle = BG; ctx.fillRect(0, 0, w, h);
    if (old) ctx.drawImage(old, 0, 0);
    lines.width = w; lines.height = h;
    renderPage();
    undoStack = []; redoStack = []; updateUndoButtons();
  }

  // ---------- coloring pages ----------
  let pageToken = 0;
  function renderPage() {
    const token = ++pageToken;
    lctx.clearRect(0, 0, lines.width, lines.height);
    const page = PAGES.find(p => p.id === state.page);
    if (!page) return;
    const img = new Image();
    img.onload = () => {
      if (token !== pageToken) return;
      const W = lines.width, H = lines.height;
      const pad = Math.min(W, H) * 0.04;
      const s = Math.min((W - pad * 2) / img.width, (H - pad * 2) / img.height);
      const w = img.width * s, h = img.height * s;
      lctx.fillStyle = '#fff'; lctx.fillRect(0, 0, W, H);
      lctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
      // turn white into transparent: darkness becomes alpha, so only the lines remain
      const data = lctx.getImageData(0, 0, W, H), d = data.data;
      for (let i = 0; i < d.length; i += 4) {
        const a = 255 - (d[i] + d[i + 1] + d[i + 2]) / 3;
        d[i] = d[i + 1] = d[i + 2] = 0; d[i + 3] = a;
      }
      lctx.putImageData(data, 0, 0);
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(page.svg);
  }
  function setPage(id) {
    state.page = id;
    try { id ? localStorage.setItem(PAGE_KEY, id) : localStorage.removeItem(PAGE_KEY); } catch {}
    renderPage();
    voiceBtn.textContent = ANIMAL_EMOJI[id] || '🔊';
    voiceBtn.classList.toggle('hidden', !id);
  }
  // round button with the animal: tap to hear it
  const voiceBtn = document.getElementById('voice');
  function speakAnimal() {
    const page = PAGES.find(p => p.id === state.page);
    if (!page) return;
    voiceBtn.classList.remove('play'); void voiceBtn.offsetWidth; voiceBtn.classList.add('play');
    SFX.voice(page.id, page.name);
  }
  voiceBtn.onclick = speakAnimal;

  // ---------- history ----------
  function snapshot() {
    undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    if (undoStack.length > MAX_UNDO) undoStack.shift();
    redoStack = [];
    updateUndoButtons();
  }
  function undo() {
    if (!undoStack.length) return;
    redoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    ctx.putImageData(undoStack.pop(), 0, 0);
    updateUndoButtons(); saveDraftSoon();
  }
  function redo() {
    if (!redoStack.length) return;
    undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    ctx.putImageData(redoStack.pop(), 0, 0);
    updateUndoButtons(); saveDraftSoon();
  }
  function updateUndoButtons() {
    document.getElementById('undo').disabled = !undoStack.length;
    document.getElementById('redo').disabled = !redoStack.length;
  }

  // ---------- drawing ----------
  const strokes = new Map(); // pointerId -> {x,y,mx,my}
  function pos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * dpr, y: (e.clientY - r.top) * dpr, cx: e.clientX - r.left, cy: e.clientY - r.top };
  }
  const patterns = {};
  function strokeColor() {
    if (state.tool === 'eraser') return BG;
    if (state.color === RAINBOW) { state.hue = (state.hue + 4) % 360; return `hsl(${state.hue},90%,55%)`; }
    if (PAINTS.isSpecial(state.color)) {
      // glitter/pearl brush: the texture is anchored to the canvas, so strokes and fills match up
      return patterns[state.color] || (patterns[state.color] = ctx.createPattern(PAINTS.tile(state.color).canvas, 'repeat'));
    }
    return state.color;
  }
  // little burst of sparkles where a glitter/pearl fill landed
  function burst(p, kind) {
    const icons = kind === 'pearl' ? ['🫧', '✨', '🤍'] : ['✨', '⭐', '💫'];
    for (let i = 0; i < 9; i++) {
      const s = el('div', 'burst', icons[i % icons.length]);
      const a = (i / 9) * Math.PI * 2 + Math.random() * .5, r = 50 + Math.random() * 40;
      s.style.left = p.cx + 'px'; s.style.top = p.cy + 'px';
      s.style.setProperty('--dx', Math.cos(a) * r + 'px'); s.style.setProperty('--dy', Math.sin(a) * r + 'px');
      wrap.appendChild(s);
      setTimeout(() => s.remove(), 750);
    }
  }
  const paintKind = key => key.startsWith('g:') ? 'glitter' : key.startsWith('p:') ? 'pearl' : 'plain';
  function lineWidth(e) {
    let w = SIZES[state.sizeIdx] * dpr * (state.tool === 'eraser' ? 2.2 : 1);
    if (e.pointerType === 'pen' && e.pressure > 0) w *= 0.4 + e.pressure * 1.2;
    return w;
  }
  function dot(x, y, w, color) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, w / 2, 0, Math.PI * 2); ctx.fill();
  }

  // stickers: a preview follows the finger, the sticker is placed where the finger lifts
  let stickerPointer = null;
  function showGhost(p) {
    ghost.textContent = state.sticker;
    ghost.style.fontSize = STICKER_SIZES[state.sizeIdx] + 'px';
    ghost.style.left = p.cx + 'px'; ghost.style.top = p.cy + 'px';
    ghost.classList.remove('hidden');
  }
  function placeSticker(p) {
    snapshot();
    const s = STICKER_SIZES[state.sizeIdx] * dpr;
    ctx.save();
    ctx.font = `${s}px ${EMOJI_FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(state.sticker, p.x, p.y);
    ctx.restore();
    SFX.play('pop');
    saveDraftSoon();
  }

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch {}
    const p = pos(e);
    if (state.tool === 'sticker') {
      if (stickerPointer !== null) return;
      stickerPointer = e.pointerId; showGhost(p); return;
    }
    if (state.tool === 'fill') {
      snapshot();
      const paint = fillColor();
      if (floodFill(Math.floor(p.x), Math.floor(p.y), paint)) {
        const kind = paintKind(paint);
        SFX.play(kind === 'glitter' ? 'sparkle' : kind === 'pearl' ? 'pearl' : 'plop');
        if (kind !== 'plain') burst(p, kind);
        saveDraftSoon();
      } else undoStack.pop(), updateUndoButtons();
      return;
    }
    if (strokes.size === 0) snapshot();
    strokes.set(e.pointerId, { x: p.x, y: p.y, mx: p.x, my: p.y });
    dot(p.x, p.y, lineWidth(e), strokeColor());
  });

  canvas.addEventListener('pointermove', e => {
    if (e.pointerId === stickerPointer) { showGhost(pos(e)); return; }
    const last = strokes.get(e.pointerId);
    if (!last) return;
    const events = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
    for (const ev of events) {
      const p = pos(ev);
      // smooth with quadratic curves through midpoints
      const mx = (last.x + p.x) / 2, my = (last.y + p.y) / 2;
      ctx.strokeStyle = strokeColor();
      ctx.lineWidth = lineWidth(ev);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(last.mx, last.my);
      ctx.quadraticCurveTo(last.x, last.y, mx, my);
      ctx.stroke();
      last.x = p.x; last.y = p.y; last.mx = mx; last.my = my;
    }
  });

  function endPointer(e, cancelled) {
    if (e.pointerId === stickerPointer) {
      stickerPointer = null; ghost.classList.add('hidden');
      if (!cancelled) placeSticker(pos(e));
      return;
    }
    const last = strokes.get(e.pointerId);
    if (!last) return;
    ctx.strokeStyle = strokeColor(); ctx.lineWidth = lineWidth(e); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(last.mx, last.my); ctx.lineTo(last.x, last.y); ctx.stroke();
    strokes.delete(e.pointerId);
    saveDraftSoon();
  }
  canvas.addEventListener('pointerup', e => endPointer(e, false));
  canvas.addEventListener('pointercancel', e => endPointer(e, true));

  // ---------- flood fill ----------
  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  let rainbowIdx = 0;
  function fillColor() {
    if (state.color !== RAINBOW) return state.color;
    const bright = COLORS.slice(2, 12);
    return bright[rainbowIdx++ % bright.length];
  }
  // paint: a hex color or a special paint key (glitter/pearl tile). Returns true if something was filled.
  function floodFill(sx, sy, paint) {
    const w = canvas.width, h = canvas.height;
    if (sx < 0 || sy < 0 || sx >= w || sy >= h) return false;
    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;
    const tile = PAINTS.isSpecial(paint) ? PAINTS.tile(paint).data : null;
    const TM = PAINTS.T - 1;
    const [fr, fg, fb] = tile ? [0, 0, 0] : hexToRgb(paint);
    const i0 = (sy * w + sx) * 4;
    const tr = d[i0], tg = d[i0 + 1], tb = d[i0 + 2];
    let match;
    if (state.page) {
      // coloring page: the outlines alone decide the area, so a sparkly area can be
      // refilled cleanly with another color (fill also goes under the lines' soft edges)
      const walls = lctx.getImageData(0, 0, w, h).data;
      if (walls[i0 + 3] > 110) return false;
      match = i => walls[i + 3] <= 110;
    } else {
      if (!tile && Math.abs(tr - fr) + Math.abs(tg - fg) + Math.abs(tb - fb) < 10) return false;
      const TOL = 90; // tolerant so antialiased edges get filled too
      match = i => Math.abs(d[i] - tr) + Math.abs(d[i + 1] - tg) + Math.abs(d[i + 2] - tb) <= TOL;
    }
    const seen = new Uint8Array(w * h);
    const stack = [sx, sy];
    while (stack.length) {
      const y = stack.pop(); let x = stack.pop();
      let idx = y * w + x;
      while (x >= 0 && !seen[idx] && match(idx * 4)) { x--; idx--; }
      x++; idx++;
      let up = false, down = false;
      while (x < w && !seen[idx] && match(idx * 4)) {
        seen[idx] = 1;
        const p = idx * 4;
        if (tile) {
          const t = (((y & TM) << 8) | (x & TM)) * 4; // tile is 256 wide
          d[p] = tile[t]; d[p + 1] = tile[t + 1]; d[p + 2] = tile[t + 2];
        } else { d[p] = fr; d[p + 1] = fg; d[p + 2] = fb; }
        d[p + 3] = 255;
        if (y > 0) {
          const u = idx - w;
          if (!seen[u] && match(u * 4)) { if (!up) { stack.push(x, y - 1); up = true; } } else up = false;
        }
        if (y < h - 1) {
          const dn = idx + w;
          if (!seen[dn] && match(dn * 4)) { if (!down) { stack.push(x, y + 1); down = true; } } else down = false;
        }
        x++; idx++;
      }
    }
    ctx.putImageData(img, 0, 0);
    return true;
  }

  // ---------- bottom panel ----------
  const toolsBox = document.getElementById('tools');
  const colorsBox = document.getElementById('colors');
  const stickersBox = document.getElementById('stickers');

  TOOLS.forEach(t => {
    const b = el('button', 'btn', t.icon);
    b.dataset.tool = t.id;
    b.onclick = () => { state.tool = t.id; renderUI(); };
    toolsBox.appendChild(b);
  });
  const sizeBtn = el('button', 'btn', '<i class="size-dot"></i>');
  sizeBtn.title = 'Товщина';
  sizeBtn.onclick = () => { state.sizeIdx = (state.sizeIdx + 1) % SIZES.length; renderUI(); };
  toolsBox.appendChild(sizeBtn);

  // palette tabs: plain paints / glitter / pearl
  const ptabsBox = document.getElementById('ptabs');
  PALETTE_TABS.forEach(t => {
    const b = el('button', 'ptab', `<b>${t.icon}</b>${t.name}`);
    b.dataset.tab = t.id;
    b.onclick = () => { state.tab = t.id; SFX.play('tap'); renderSwatches(); renderUI(); };
    ptabsBox.appendChild(b);
  });
  function renderSwatches() {
    colorsBox.innerHTML = '';
    const keys = state.tab === 'glitter' ? PAINTS.GLITTER : state.tab === 'pearl' ? PAINTS.PEARL : [...COLORS, RAINBOW];
    keys.forEach(c => {
      const special = PAINTS.isSpecial(c);
      const b = el('button', 'color' + (c === RAINBOW ? ' rainbow' : '') + (special ? ' tex' : ''));
      if (special) b.style.backgroundImage = `url(${PAINTS.swatchURL(c)})`;
      else if (c !== RAINBOW) b.style.background = c;
      b.dataset.color = c;
      b.onclick = () => {
        state.color = c;
        if (state.tool === 'eraser') state.tool = 'brush';
        if (special) SFX.play(paintKind(c) === 'pearl' ? 'pearl' : 'sparkle'); else SFX.play('tap');
        renderUI();
      };
      colorsBox.appendChild(b);
    });
  }
  renderSwatches();
  STICKERS.forEach(s => {
    const b = el('button', 'sticker', s);
    b.dataset.sticker = s;
    b.onclick = () => { state.sticker = s; renderUI(); };
    stickersBox.appendChild(b);
  });

  function renderUI() {
    toolsBox.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === state.tool));
    toolsBox.querySelector('[data-tool="sticker"]').textContent = state.sticker;
    const isSticker = state.tool === 'sticker';
    stickersBox.classList.toggle('hidden', !isSticker);
    colorsBox.classList.toggle('hidden', isSticker);
    ptabsBox.classList.toggle('hidden', isSticker);
    ptabsBox.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
    colorsBox.querySelectorAll('[data-color]').forEach(b => b.classList.toggle('on', b.dataset.color === state.color && state.tool !== 'eraser'));
    stickersBox.querySelectorAll('[data-sticker]').forEach(b => b.classList.toggle('on', b.dataset.sticker === state.sticker));
    const px = [10, 18, 28][state.sizeIdx];
    const dotEl = sizeBtn.querySelector('.size-dot');
    dotEl.style.width = dotEl.style.height = px + 'px';
    dotEl.style.background = state.color === RAINBOW ? 'conic-gradient(#e53935,#fdd835,#7cb342,#29b6f6,#7e57c2,#e53935)'
      : PAINTS.isSpecial(state.color) ? `center / 60px url(${PAINTS.swatchURL(state.color)})`
      : (state.color === '#ffffff' ? '#ccc' : state.color);
  }

  // toast
  const toast = document.getElementById('toast');
  let toastT;
  function pop(emoji) {
    toast.textContent = emoji; toast.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => toast.classList.remove('show'), 700);
  }

  // ---------- top bar ----------
  document.getElementById('undo').onclick = undo;
  document.getElementById('redo').onclick = redo;

  const clearBtn = document.getElementById('clear');
  let clearArmed = null;
  clearBtn.onclick = () => {
    if (!clearArmed) { // first tap: wiggle, second tap within 2s clears
      clearBtn.classList.add('warn');
      clearArmed = setTimeout(() => { clearBtn.classList.remove('warn'); clearArmed = null; }, 2000);
      return;
    }
    clearTimeout(clearArmed); clearArmed = null; clearBtn.classList.remove('warn');
    snapshot();
    ctx.fillStyle = BG; ctx.fillRect(0, 0, canvas.width, canvas.height);
    pop('✨'); saveDraftSoon();
  };

  // save picture to the phone (share sheet → "Save image", or a download)
  function compositeCanvas() {
    const t = document.createElement('canvas');
    t.width = canvas.width; t.height = canvas.height;
    const tc = t.getContext('2d');
    tc.drawImage(canvas, 0, 0);
    tc.drawImage(lines, 0, 0);
    return t;
  }
  document.getElementById('share').onclick = () => {
    compositeCanvas().toBlob(async blob => {
      const file = new File([blob], `malyunok-${Date.now()}.png`, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); } catch {}
        return;
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      pop('🌟');
    }, 'image/png');
  };

  // ---------- coloring pages picker ----------
  const pagesBox = document.getElementById('pages');
  const catsBox = document.getElementById('cats');
  const pagesGrid = document.getElementById('pagesGrid');
  let currentCat = (() => { try { return localStorage.getItem(CAT_KEY); } catch { return null; } })();
  const usedCats = CATEGORIES.filter(c => PAGES.some(p => p.cat === c.id));
  if (!usedCats.some(c => c.id === currentCat)) currentCat = usedCats[0]?.id;

  function choosePage(id) {
    ctx.fillStyle = BG; ctx.fillRect(0, 0, canvas.width, canvas.height);
    undoStack = []; redoStack = []; updateUndoButtons();
    setPage(id);
    state.tool = id ? 'fill' : 'brush';
    renderUI();
    pagesBox.classList.add('hidden');
    saveDraftSoon();
    if (id) speakAnimal();
  }
  const soundBtn = document.getElementById('soundToggle');
  const renderSound = () => { soundBtn.textContent = SFX.muted ? '🔇' : '🔊'; };
  soundBtn.onclick = () => { SFX.setMuted(!SFX.muted); renderSound(); SFX.play('tap'); };
  renderSound();
  function renderPicker() {
    catsBox.innerHTML = '';
    usedCats.forEach(c => {
      const b = el('button', 'cat' + (c.id === currentCat ? ' on' : ''), `<b>${c.icon}</b>${c.name}`);
      b.onclick = () => { currentCat = c.id; try { localStorage.setItem(CAT_KEY, c.id); } catch {} renderPicker(); pagesGrid.scrollTop = 0; };
      catsBox.appendChild(b);
    });
    pagesGrid.innerHTML = '';
    const blank = el('div', 'card blank', '📄<span>Чистий аркуш</span>');
    blank.onclick = () => choosePage(null);
    pagesGrid.appendChild(blank);
    PAGES.filter(p => p.cat === currentCat).forEach(p => {
      const card = el('div', 'card');
      const img = new Image();
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(p.svg);
      card.append(img, el('span', '', p.name));
      card.onclick = () => choosePage(p.id);
      pagesGrid.appendChild(card);
    });
  }
  document.getElementById('openPages').onclick = () => { renderPicker(); pagesBox.classList.remove('hidden'); };
  document.getElementById('closePages').onclick = () => pagesBox.classList.add('hidden');

  // ---------- autosave draft so nothing is lost on reload ----------
  let draftT;
  function saveDraftSoon() {
    clearTimeout(draftT);
    draftT = setTimeout(() => { try { localStorage.setItem(DRAFT_KEY, canvas.toDataURL('image/png')); } catch {} }, 800);
  }
  function restoreDraft() {
    try { const p = localStorage.getItem(PAGE_KEY); if (PAGES.some(x => x.id === p)) setPage(p); } catch {}
    let url; try { url = localStorage.getItem(DRAFT_KEY); } catch {}
    if (!url) return;
    const img = new Image();
    img.onload = () => {
      const s = Math.min(canvas.width / img.width, canvas.height / img.height);
      const w = img.width * s, h = img.height * s;
      ctx.drawImage(img, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
    };
    img.src = url;
  }

  // block pinch-zoom / double-tap zoom / context menu
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('contextmenu', e => e.preventDefault());

  new ResizeObserver(resize).observe(wrap);
  resize();
  restoreDraft();
  renderUI();
  updateUndoButtons();

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
