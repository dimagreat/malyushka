<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Малюшка">
<meta name="theme-color" content="#ffd84d">
<title>Малюшка</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --bar: #ffd84d;
    --bar-dark: #f2b705;
    --on: #6bd36b;
    --on-dark: #2e9e2e;
    --shadow: 0 3px 0 rgba(0,0,0,.18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; touch-action: none; overscroll-behavior: none; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  .bar { background: var(--bar); flex: none; padding: 6px 10px; }
  .top { display: flex; align-items: center; gap: 8px; padding-top: max(6px, env(safe-area-inset-top)); border-bottom: 4px solid var(--bar-dark); }
  .bottom { display: flex; flex-direction: column; gap: 8px; padding-bottom: max(8px, env(safe-area-inset-bottom)); border-top: 4px solid var(--bar-dark); }
  .spacer { flex: 1; }

  button { font: inherit; border: none; cursor: pointer; padding: 0; color: inherit; }
  .btn { flex: none; width: 50px; height: 50px; border-radius: 15px; background: #fff; font-size: 27px; box-shadow: var(--shadow); display: grid; place-items: center; transition: transform .1s; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .btn:disabled { opacity: .35; }
  .btn.warn { animation: wiggle .4s infinite; background: #ff7a7a; }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }

  /* tools: always fit the width, never scroll */
  .top .btn { width: 46px; height: 46px; font-size: 25px; }
  @media (max-width: 400px) { .top { gap: 6px; } .top .btn { width: 43px; height: 43px; font-size: 23px; } }
  .paper-sw { display: block; width: 26px; height: 26px; border-radius: 7px; box-shadow: inset 0 0 0 2px rgba(0,0,0,.25); }
  .tools { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; max-width: 460px; width: 100%; margin: 0 auto; }
  .tools .btn { width: 100%; height: 56px; font-size: 30px; }
  .tools .btn.on { background: var(--on); box-shadow: 0 0 0 3px var(--on-dark), var(--shadow); }
  .size-dot { display: block; border-radius: 50%; background: #333; }

  /* palette: wraps into rows, never scrolls */
  .palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 8px; justify-items: center; max-width: 620px; width: 100%; margin: 0 auto; }
  .color { width: 40px; height: 40px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(0,0,0,.12), var(--shadow); }
  .color.on { box-shadow: 0 0 0 3px #fff, 0 0 0 6px #333; }
  .color.rainbow { background: conic-gradient(#e53935, #fdd835, #7cb342, #29b6f6, #7e57c2, #ec407a, #e53935); }
  .color.tex { background-size: 120px; background-position: center; }
  .color.neon { box-shadow: 0 0 10px 2px var(--c), inset 0 0 0 4px rgba(255,255,255,.6), inset 0 0 8px 4px #fff; }
  .color.neon.on { box-shadow: 0 0 10px 2px var(--c), 0 0 0 3px #fff, 0 0 0 6px #333, inset 0 0 8px 4px #fff; }
  .ptabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-width: 460px; width: 100%; margin: 0 auto; }
  .ptab { height: 38px; border-radius: 12px; background: rgba(255,255,255,.55); font-size: 22px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 800; font-size: 15px; color: #6b5200; }
  .ptab b { font-size: 22px; }
  .ptab.on { background: #fff; color: #333; box-shadow: var(--shadow); }
  @media (max-width: 480px) { .ptab span { display: none; } .ptab b { font-size: 24px; } }
  .tools .btn.cycle { animation: pulse .25s; }
  @keyframes pulse { 50% { transform: scale(1.18); } }
  /* coloring page finished: the picture jumps and confetti falls */
  #wrap.yay canvas { animation: yay .5s ease-in-out 3; }
  @keyframes yay { 0%,100% { transform: none; } 40% { transform: translateY(-4%) scale(1.04) rotate(-1.5deg); } 70% { transform: translateY(0) scale(.98) rotate(1deg); } }
  .confetti { position: absolute; top: -30px; pointer-events: none; z-index: 3; animation: fall var(--t) cubic-bezier(.3,.6,.6,1) forwards; }
  @keyframes fall { to { transform: translate(var(--dx), calc(100vh + 40px)) rotate(var(--r)); } }
  .burst { position: absolute; pointer-events: none; font-size: 22px; animation: burst .7s ease-out forwards; }
  @keyframes burst { from { transform: translate(-50%,-50%) scale(.4); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(90deg); opacity: 0; } }
  .voice { position: absolute; left: 10px; top: 10px; width: 60px; height: 60px; border-radius: 50%; font-size: 34px; background: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.18), 0 0 0 4px var(--bar); display: grid; place-items: center; z-index: 2; }
  .voice.play { animation: wiggle .3s 3; }
  .sticker { width: 44px; height: 44px; border-radius: 12px; background: #fff; font-size: 28px; box-shadow: var(--shadow); display: grid; place-items: center; }
  .sticker.on { background: var(--on); box-shadow: 0 0 0 3px var(--on-dark); }
  .hidden { display: none !important; }

  #wrap { position: relative; flex: 1; min-height: 0; background: #fff; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #lines { pointer-events: none; }
  #ghost { position: absolute; left: 0; top: 0; pointer-events: none; line-height: 1; transform: translate(-50%, -50%) scale(1.15); opacity: .85; filter: drop-shadow(0 6px 6px rgba(0,0,0,.25)); font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }

  /* coloring pages picker */
  #pages { position: fixed; inset: 0; z-index: 10; background: #fff7d6; display: flex; flex-direction: column; }
  #pages header { display: flex; align-items: center; gap: 10px; padding: max(10px, env(safe-area-inset-top)) 12px 10px; background: var(--bar); border-bottom: 4px solid var(--bar-dark); }
  #pages h1 { margin: 0; font-size: 24px; }
  .cats { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; flex: none; }
  .cat { flex: none; display: flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 999px; background: #fff; font-size: 18px; font-weight: 800; box-shadow: var(--shadow); white-space: nowrap; }
  .cat b { font-size: 26px; }
  .cat.on { background: var(--on); box-shadow: 0 0 0 3px var(--on-dark); }
  .grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; padding: 4px 12px max(16px, env(safe-area-inset-bottom)); align-content: start; touch-action: pan-y; }
  .card { position: relative; background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 0 rgba(0,0,0,.15); aspect-ratio: 1; cursor: pointer; }
  .card img { width: 100%; height: 100%; object-fit: contain; display: block; padding: 8px 8px 34px; }
  .card span { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-weight: 800; font-size: 19px; color: #333; }
  .card.blank { display: grid; place-items: center; font-size: 70px; padding-bottom: 24px; }

  #toast { position: fixed; left: 50%; top: 40%; transform: translate(-50%,-50%) scale(.5); font-size: 90px; opacity: 0; pointer-events: none; transition: all .35s cubic-bezier(.3,1.6,.5,1); z-index: 20; }
  #toast.show { opacity: 1; transform: translate(-50%,-50%) scale(1); }
</style>
</head>
<body>
<div id="app">
  <div class="bar top">
    <button class="btn" id="undo" title="Назад">↩️</button>
    <button class="btn" id="redo" title="Вперед">↪️</button>
    <div class="spacer"></div>
    <button class="btn" id="paper" title="Колір аркуша"><i class="paper-sw"></i></button>
    <button class="btn" id="soundToggle" title="Звук">🔊</button>
    <button class="btn" id="openPages" title="Розмальовки">🐿️</button>
    <button class="btn" id="share" title="Зберегти на телефон">📤</button>
    <button class="btn" id="clear" title="Очистити">🗑️</button>
  </div>

  <div id="wrap">
    <canvas id="c"></canvas>
    <canvas id="lines"></canvas>
    <div id="ghost" class="hidden"></div>
    <button class="voice hidden" id="voice" title="Голос тваринки"></button>
  </div>

  <div class="bar bottom">
    <div class="tools" id="tools"></div>
    <div class="ptabs" id="ptabs"></div>
    <div class="palette" id="colors"></div>
    <div class="palette hidden" id="stickers"></div>
  </div>
</div>

<div id="pages" class="hidden">
  <header><button class="btn" id="closePages">✖️</button><h1>Розмальовки</h1></header>
  <div class="cats" id="cats"></div>
  <div class="grid" id="pagesGrid"></div>
</div>

<div id="toast"></div>

<script src="paints.js"></script>
<script src="sounds/animals.js"></script>
<script src="sounds.js"></script>
<script src="pages/core.js"></script>
<script src="pages/home.js"></script>
<script src="pages/farm.js"></script>
<script src="pages/sea.js"></script>
<script src="pages/savanna.js"></script>
<script src="pages/forest.js"></script>
<script src="pages/dino.js"></script>
<script src="pages/transport.js"></script>
<script src="pages/fairy.js"></script>
<script src="pages/holiday.js"></script>
<script>
(() => {
  const COLORS = ['#000000','#ffffff','#e53935','#ff7043','#ffb300','#fdd835','#7cb342','#2e7d32','#29b6f6','#1e63d6','#7e57c2','#ec407a','#8d6e63'];
  const RAINBOW = 'rainbow';
  const SIZES = [6, 14, 28];              // brush width in CSS px
  const STICKER_SIZES = [56, 90, 130];    // sticker size in CSS px for the same 3 steps
  const STICKERS = ['⭐','❤️','🌸','🌈','☀️','🎈','👑','🦄','🐱','🐶','🐮','🐷','🐔','🐑','🦁','🐘','🐻','🦉','🐳','🐟','🦋'];
  const TOOLS = [
    { id: 'brush',   icon: '🖌️' },
    { id: 'fill',    icon: '🪣' },
    { id: 'stamp',   icon: '⭐' },
    { id: 'sticker', icon: '⭐' },
    { id: 'eraser',  icon: '🧽' },
  ];
  const MAX_UNDO = 30;
  const DRAFT_KEY = 'malyushka-draft';
  const PAGE_KEY = 'malyushka-page';
  const CAT_KEY = 'malyushka-cat';
  const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

  const { CATEGORIES, PAGES } = window.COLORING;
  const PAINTS = window.PAINTS;
  const SFX = window.SFX;
  const PALETTE_TABS = [
    { id: 'plain',   icon: '🎨', name: 'Фарби' },
    { id: 'glitter', icon: '✨', name: 'Блискітки' },
    { id: 'pearl',   icon: '🫧', name: 'Перламутр' },
    { id: 'neon',    icon: '🌟', name: 'Неон' },
  ];
  const ANIMAL_EMOJI = {
    cat: '🐱', bunny: '🐰', puppy: '🐶', hamster: '🐹', parrot: '🦜',
    cow: '🐮', pig: '🐷', chicken: '🐔', sheep: '🐑',
    fish: '🐟', octopus: '🐙', whale: '🐳', turtle: '🐢', crab: '🦀',
    lion: '🦁', elephant: '🐘', giraffe: '🦒', zebra: '🦓',
    squirrel: '🐿️', bear: '🐻', owl: '🦉', hedgehog: '🦔', butterfly: '🦋',
    trex: '🦖', brachio: '🦕', triceratops: '🦖', stego: '🦕', babydino: '🥚',
    car: '🚗', firetruck: '🚒', train: '🚂', plane: '✈️', ship: '🚢',
    unicorn: '🦄', dragon: '🐉', castle: '🏰', mermaid: '🧜‍♀️', fairy: '🧚',
    tree: '🎄', cake: '🎂', snowman: '⛄', gift: '🎁', balloons: '🎈',
  };
  const NEON = ['#ff2bd6', '#ff3b5c', '#ff9a1f', '#fff23a', '#7dff3a', '#21ffb5', '#22e6ff', '#3a7bff', '#b14bff', '#ffffff'].map(c => 'n:' + c);
  // stamp brush shapes, drawn in the current paint (so glitter stars, neon hearts...)
  const STAMPS = [
    { id: 'heart', icon: '❤️' }, { id: 'star', icon: '⭐' }, { id: 'flower', icon: '🌸' },
    { id: 'paw', icon: '🐾' }, { id: 'dot', icon: '🔵' }, { id: 'bubble', icon: '🫧' },
  ];
  // paper colors; dark paper gets white outlines on coloring pages
  const PAPERS = [
    { c: '#ffffff' }, { c: '#15142b', dark: true }, { c: '#cdeeff' }, { c: '#ffe0ee' }, { c: '#fff1bd' }, { c: '#d8f6cf' },
  ];
  const PAPER_KEY = 'malyushka-paper';
  // stickers that make a sound when placed: sticker -> page id of the voice
  const STICKER_VOICE = { '🐱': 'cat', '🐶': 'puppy', '🐮': 'cow', '🐷': 'pig', '🐔': 'chicken', '🐑': 'sheep',
    '🦁': 'lion', '🐘': 'elephant', '🐻': 'bear', '🦉': 'owl', '🐳': 'whale', '🐟': 'fish', '🦋': 'butterfly', '🦄': 'unicorn' };

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  // Coloring-page outlines live on their own layer above the paint, so brushes never cover the lines.
  const lines = document.getElementById('lines');
  const lctx = lines.getContext('2d', { willReadFrequently: true });
  const wrap = document.getElementById('wrap');
  const ghost = document.getElementById('ghost');

  const state = { tool: 'brush', sizeIdx: 1, sticker: STICKERS[0], stamp: 0, hue: 0, page: null, paper: 0 };
  // each paint tool remembers its own paint; eraser and stickers keep the last paint tool's one
  const paints = {
    brush: { color: COLORS[2], tab: 'plain' },
    fill:  { color: COLORS[4], tab: 'plain' },
    stamp: { color: RAINBOW,   tab: 'plain' },
  };
  let paintTool = 'brush';
  const curPaint = () => paints[paints[state.tool] ? (paintTool = state.tool) : paintTool];
  Object.defineProperty(state, 'color', { get: () => curPaint().color, set: v => { curPaint().color = v; } });
  Object.defineProperty(state, 'tab', { get: () => curPaint().tab, set: v => { curPaint().tab = v; } });
  try { const p = +localStorage.getItem(PAPER_KEY); if (PAPERS[p]) state.paper = p; } catch {}
  const paper = () => PAPERS[state.paper];
  let undoStack = [], redoStack = [];
  let dpr = 1;

  const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };

  // ---------- canvas setup ----------
  function resize() {
    const rect = wrap.getBoundingClientRect();
    const newDpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.round(rect.width * newDpr), h = Math.round(rect.height * newDpr);
    if (!w || !h || (w === canvas.width && h === canvas.height)) return;
    // keep the paint (unless an earlier copy is still waiting to be placed)
    if (!pendingPaint && canvas.width && canvas.height) {
      const old = document.createElement('canvas');
      old.width = canvas.width; old.height = canvas.height;
      old.getContext('2d').drawImage(canvas, 0, 0);
      pendingPaint = old;
    }
    dpr = newDpr;
    canvas.width = w; canvas.height = h; // paint layer is transparent: the paper is the #wrap background
    lines.width = w; lines.height = h;
    renderPage();
    placePaint();
    undoStack = []; redoStack = []; updateUndoButtons();
  }

  // Paint from another canvas size (window resized, phone rotated, draft from another screen)
  // must move together with the outlines, so it is mapped from the old drawing area to the new one.
  let pendingPaint = null;
  function pageRect(b, W, H) {
    const pad = Math.min(W, H) * 0.03;
    const s = Math.min((W - pad * 2) / b.w, (H - pad * 2) / b.h);
    return { x: (W - b.w * s) / 2, y: (H - b.h * s) / 2, w: b.w * s, h: b.h * s };
  }
  function placePaint() {
    const src = pendingPaint;
    if (!src) return;
    const W0 = src.width, H0 = src.height, W = canvas.width, H = canvas.height;
    let s, x, y;
    if (state.page) {
      const b = boxes[state.page];
      if (!b) return; // the page is still loading: renderPage places it when ready
      const r0 = pageRect(b, W0, H0), r1 = pageRect(b, W, H);
      s = r1.w / r0.w; x = r1.x - r0.x * s; y = r1.y - r0.y * s;
    } else {
      s = Math.min(W / W0, H / H0); x = (W - W0 * s) / 2; y = (H - H0 * s) / 2;
    }
    pendingPaint = null;
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(src, x, y, W0 * s, H0 * s);
  }

  // ---------- coloring pages ----------
  let pageToken = 0;
  // bounding box of the dark lines in the page image (cached per page)
  const boxes = {};
  function drawingBox(id, img) {
    if (boxes[id]) return boxes[id];
    const W = img.width, H = img.height;
    const t = document.createElement('canvas'); t.width = W; t.height = H;
    const g = t.getContext('2d', { willReadFrequently: true });
    g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.drawImage(img, 0, 0);
    const d = g.getImageData(0, 0, W, H).data;
    let x0 = W, y0 = H, x1 = -1, y1 = -1;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      if (d[i] + d[i + 1] + d[i + 2] < 600) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    if (x1 < 0) return { x: 0, y: 0, w: W, h: H };
    return (boxes[id] = { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 });
  }
  function renderPage() {
    const token = ++pageToken;
    lctx.clearRect(0, 0, lines.width, lines.height);
    const page = PAGES.find(p => p.id === state.page);
    if (!page) return;
    const img = new Image();
    img.onload = () => {
      if (token !== pageToken) return;
      const W = lines.width, H = lines.height;
      // crop to the drawing itself so it fills as much of the paper as possible
      const b = drawingBox(page.id, img);
      const r = pageRect(b, W, H);
      lctx.fillStyle = '#fff'; lctx.fillRect(0, 0, W, H);
      lctx.drawImage(img, b.x, b.y, b.w, b.h, r.x, r.y, r.w, r.h);
      placePaint();
      // turn white into transparent: darkness becomes alpha, so only the lines remain
      // (white lines on dark paper)
      const data = lctx.getImageData(0, 0, W, H), d = data.data;
      const lc = paper().dark ? 255 : 0;
      for (let i = 0; i < d.length; i += 4) {
        const a = 255 - (d[i] + d[i + 1] + d[i + 2]) / 3;
        d[i] = d[i + 1] = d[i + 2] = lc; d[i + 3] = a;
      }
      lctx.putImageData(data, 0, 0);
      analyzeRegions(d, W, H);
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(page.svg);
  }
  // ---------- "finished!" detection: which closed areas of the page are colored ----------
  // The outline is sampled on a coarse grid and split into areas; the outside and tiny bits are ignored.
  const STEP = 3;
  let regions = null, celebrated = false;
  function analyzeRegions(d, W, H) {
    const gw = Math.floor(W / STEP), gh = Math.floor(H / STEP);
    const labels = new Int32Array(gw * gh), sizes = [0], border = [false];
    const wall = (gx, gy) => d[((gy * STEP) * W + gx * STEP) * 4 + 3] > 110;
    const stack = new Int32Array(gw * gh);
    for (let s = 0; s < gw * gh; s++) {
      if (labels[s] || wall(s % gw, (s / gw) | 0)) continue;
      const id = sizes.length; let n = 0, edge = false, top = 0;
      stack[top++] = s; labels[s] = id;
      while (top) {
        const c = stack[--top], x = c % gw, y = (c / gw) | 0; n++;
        if (x === 0 || y === 0 || x === gw - 1 || y === gh - 1) edge = true;
        const nb = [x > 0 ? c - 1 : -1, x < gw - 1 ? c + 1 : -1, y > 0 ? c - gw : -1, y < gh - 1 ? c + gw : -1];
        for (const m of nb) if (m >= 0 && !labels[m] && !wall(m % gw, (m / gw) | 0)) { labels[m] = id; stack[top++] = m; }
      }
      sizes.push(n); border.push(edge);
    }
    const min = gw * gh * 0.0015;
    regions = { labels, gw, gh, W, sizes, big: sizes.map((n, i) => i > 0 && !border[i] && n >= min) };
  }
  function pageDone() {
    if (!regions || !state.page) return false;
    const { labels, gw, gh, W, sizes, big } = regions;
    const d = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    const painted = new Int32Array(sizes.length);
    for (let gy = 0; gy < gh; gy++) for (let gx = 0; gx < gw; gx++) {
      const l = labels[gy * gw + gx];
      if (l && big[l] && d[((gy * STEP) * W + gx * STEP) * 4 + 3] > 200) painted[l]++;
    }
    let total = 0, done = 0;
    big.forEach((b, i) => { if (b) { total++; if (painted[i] >= sizes[i] * .6) done++; } });
    return total > 0 && done >= total * .85;
  }
  let doneT;
  function checkDone() {
    clearTimeout(doneT);

  const clearBtn = document.getElementById('clear');
  let clearArmed = null;
  clearBtn.onclick = () => {
    if (!clearArmed) { // first tap: wiggle, second tap within 2s clears
      clearBtn.classList.add('warn');
      clearArmed = setTimeout(() => { clearBtn.classList.remove('warn'); clearArmed = null; }, 2000);
      return;
    }
    clearTimeout(clearArmed); clearArmed = null; clearBtn.classList.remove('warn');
    snapshot();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    celebrated = false; pendingPaint = null;
    pop('✨'); saveDraftSoon();
  };

  // save picture to the phone (share sheet → "Save image", or a download)
  function compositeCanvas() {
    const t = document.createElement('canvas');
    t.width = canvas.width; t.height = canvas.height;
    const tc = t.getContext('2d');
    tc.fillStyle = paper().c; tc.fillRect(0, 0, t.width, t.height);
    tc.drawImage(canvas, 0, 0);
    tc.drawImage(lines, 0, 0);
    return t;
  }
  document.getElementById('share').onclick = () => {
    compositeCanvas().toBlob(async blob => {
      const file = new File([blob], `malyunok-${Date.now()}.png`, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); } catch {}
        return;
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      pop('🌟');
    }, 'image/png');
  };

  // ---------- coloring pages picker ----------
  const pagesBox = document.getElementById('pages');
  const catsBox = document.getElementById('cats');
  const pagesGrid = document.getElementById('pagesGrid');
  let currentCat = (() => { try { return localStorage.getItem(CAT_KEY); } catch { return null; } })();
  const usedCats = CATEGORIES.filter(c => PAGES.some(p => p.cat === c.id));
  if (!usedCats.some(c => c.id === currentCat)) currentCat = usedCats[0]?.id;

  function choosePage(id) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    undoStack = []; redoStack = []; updateUndoButtons();
    setPage(id);
    state.tool = id ? 'fill' : 'brush';
    renderUI();
    pagesBox.classList.add('hidden');
    saveDraftSoon();
    if (id) speakAnimal();
  }
  const soundBtn = document.getElementById('soundToggle');
  // one button, three modes: 🔊 sounds → 🎵 sounds + music → 🔇 silence
  const SOUND_MODES = { on: '🔊', music: '🎵', off: '🔇' }, NEXT_MODE = { on: 'music', music: 'off', off: 'on' };
  const renderSound = () => { soundBtn.textContent = SOUND_MODES[SFX.mode]; };
  soundBtn.onclick = () => { SFX.setMode(NEXT_MODE[SFX.mode]); renderSound(); SFX.play('tap'); };
  renderSound();
  function renderPicker() {
    catsBox.innerHTML = '';
    usedCats.forEach(c => {
      const b = el('button', 'cat' + (c.id === currentCat ? ' on' : ''), `<b>${c.icon}</b>${c.name}`);
      b.onclick = () => { currentCat = c.id; try { localStorage.setItem(CAT_KEY, c.id); } catch {} renderPicker(); pagesGrid.scrollTop = 0; };
      catsBox.appendChild(b);
    });
    pagesGrid.innerHTML = '';
    const blank = el('div', 'card blank', '📄<span>Чистий аркуш</span>');
    blank.onclick = () => choosePage(null);
    pagesGrid.appendChild(blank);
    PAGES.filter(p => p.cat === currentCat).forEach(p => {
      const card = el('div', 'card');
      const img = new Image();
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(p.svg);
      card.append(img, el('span', '', p.name));
      card.onclick = () => choosePage(p.id);
      pagesGrid.appendChild(card);
    });
  }
  document.getElementById('openPages').onclick = () => { renderPicker(); pagesBox.classList.remove('hidden'); };
  document.getElementById('closePages').onclick = () => pagesBox.classList.add('hidden');

  // ---------- autosave draft so nothing is lost on reload ----------
  let draftT;
  function saveDraftSoon() {
    clearTimeout(draftT);
    draftT = setTimeout(() => { try { localStorage.setItem(DRAFT_KEY, canvas.toDataURL('image/png')); } catch {} }, 800);
  }
  function restoreDraft() {
    try { const p = localStorage.getItem(PAGE_KEY); if (PAGES.some(x => x.id === p)) setPage(p); } catch {}
    let url; try { url = localStorage.getItem(DRAFT_KEY); } catch {}
    if (!url) return;
    const img = new Image();
    img.onload = () => {
      const t = document.createElement('canvas');
      t.width = img.width; t.height = img.height;
      const g = t.getContext('2d', { willReadFrequently: true });
      g.drawImage(img, 0, 0);
      // drafts from older versions were saved on solid white: make that white see-through
      const data = g.getImageData(0, 0, t.width, t.height), d = data.data;
      let opaque = true;
      for (let i = 3; i < d.length; i += 4 * 97) if (d[i] < 255) { opaque = false; break; }
      if (opaque) {
        for (let i = 0; i < d.length; i += 4) if (d[i] > 250 && d[i + 1] > 250 && d[i + 2] > 250) d[i + 3] = 0;
        g.putImageData(data, 0, 0);
      }
      // the draft was saved at its screen size: line it up with the outlines here
      pendingPaint = t;
      placePaint();
    };
    img.src = url;
  }

  // block pinch-zoom / double-tap zoom / context menu
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('contextmenu', e => e.preventDefault());

  new ResizeObserver(resize).observe(wrap);
  resize();
  restoreDraft();
  renderUI();
  updateUndoButtons();

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
